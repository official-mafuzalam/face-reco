{% extends "base.html" %}
{% block content %}
<form action="{% if camera %}/cameras/{{ camera.id }}/edit{% else %}/cameras/new{% endif %}?lang={{ language }}" method="post" class="form">
  {% if error %}<p role="alert" class="notice">{{ error }}</p>{% endif %}
  <div class="field">
    <label for="name">{{ t.camera_name }}</label>
    <input id="name" name="name" value="{{ camera.name if camera else '' }}" required>
  </div>
  <div class="field">
    <label for="gate">{{ t.gate }}</label>
    <input id="gate" name="gate" value="{{ camera.gate if camera else '' }}" required>
  </div>
  <div class="field">
    <label for="direction">{{ t.direction }}</label>
    <select id="direction" name="direction" required>
      <option value="IN" {% if camera and camera.direction == "IN" %}selected{% endif %}>{{ t.in }}</option>
      <option value="OUT" {% if camera and camera.direction == "OUT" %}selected{% endif %}>{{ t.out }}</option>
    </select>
  </div>
  <div class="field">
    <label for="source">{{ t.source }}</label>
    <input id="source" name="source" value="{{ source }}" required spellcheck="false">
    <small>{{ t.source_hint }}</small>
  </div>
  <div class="field">
    <label for="password">{{ t.source_password }}</label>
    <input id="password" name="password" type="password" autocomplete="new-password" value="">
    <small>{{ t.source_password_hint }}</small>
  </div>
  <label class="field-check" for="enabled">
    <input id="enabled" name="enabled" type="checkbox" value="on" {% if not camera or camera.enabled %}checked{% endif %}>
    {{ t.enabled }}
  </label>
  <fieldset class="checks">
    <legend>{{ t.camera_uses }}</legend>
    <label class="field-check"><input name="face_enabled" type="checkbox" value="on" {% if not camera or camera.face_enabled %}checked{% endif %}> {{ t.use_face }}</label>
    <label class="field-check"><input name="surveillance_enabled" type="checkbox" value="on" {% if not camera or camera.surveillance_enabled %}checked{% endif %}> {{ t.use_surveillance }}</label>
  </fieldset>
  <div class="actions">
    <button type="submit">{{ t.save }}</button>
    <a class="btn btn-secondary" href="/cameras?lang={{ language }}">{{ t.cancel }}</a>
  </div>
</form>
{% endblock %}
